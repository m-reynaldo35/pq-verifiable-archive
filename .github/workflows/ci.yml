name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # package-lock.json is currently out of sync with package.json
      # (express-rate-limit missing from the root entry); switch to `npm ci`
      # once it has been regenerated.
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
