[extend]
useDefault = true

# Algorand / BIP-39 style mnemonics: 24-25 lowercase words, quoted or not,
# with any whitespace between words (e.g. ALGORAND_MNEMONIC=word word ...).
[[rules]]
id = "algorand-mnemonic"
description = "Algorand 25-word mnemonic"
regex = '''(?:^|[^a-z])((?:[a-z]{3,8}[ \t]+){23,24}[a-z]{3,8})(?:[^a-z]|$)'''

# Public on-chain values pinned as the hosted issuer's trust anchor (an
# Algorand transaction ID is not a secret).
[allowlist]
description = "Pinned public Algorand trust-anchor values"
regexes = [
  '''BUVBKZAYLHFLAX4WLD7KA7OQZAE4QYHGY3SHY3TVKVJFGQXP3IJA''',
  '''S7NGS2LDQXB73R4XSSOS6VRCS66ZL3I5S7FQWXHB4YIXLDISLZ7Q''',
]
